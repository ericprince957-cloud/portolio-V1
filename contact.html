<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - ABSU Tutors</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body class="contact-page"> <!-- Important class for styling -->
    
    <nav class="navbar">
        <div class="logo"><a href="index.html">ABSU Tutors</a></div>
    </nav>

    <main>
        <section class="contact">
            <h2>Contact Us</h2>
            <p>Have a question? Send us a message.</p>

            <form action="mailto:ericprince613@gmail.com" method="post" enctype="text/plain">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Type your message here" rows="5" required></textarea>

                <button type="submit" class="btn full-width">Send Message</button>
            </form>

            <a href="index.html" class="back-link">&larr; Back to Home</a>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ABSU Tutors. All rights reserved.</p>
    </footer>

</body>
</html>
