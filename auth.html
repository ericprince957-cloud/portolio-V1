<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join ABSU Tutors</title>
    <link rel="stylesheet" href="style.css"> <!-- Reuse main style -->
    <link rel="stylesheet" href="auth.css">   <!-- Specific auth styles -->
</head>
<body>
    <main class="auth-container">
        <div class="auth-card">
            <div class="logo-center">ABSU Tutors</div>
            
            <div class="role-toggle">
                <button class="toggle-btn active" onclick="switchRole('student')">Student</button>
                <button class="toggle-btn" onclick="switchRole('tutor')">Tutor</button>
            </div>

            <h2 id="formTitle">Student Registration</h2>
            <p class="subtitle">Create an account to start learning or teaching.</p>

            <form id="authForm">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="John Doe" required>
                </div>
                
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="name@absu.edu.ng" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••" required>
                </div>

                <!-- Tutor Specific Field (Hidden by default) -->
                <div class="input-group tutor-only" style="display: none;">
                    <label>Department / Subject Expertise</label>
                    <input type="text" placeholder="e.g., Mathematics, Physics">
                </div>

                <button type="submit" class="btn full-width">Create Account</button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="#">Log In</a></p>
                <a href="index.html" class="back-link">&larr; Back to Home</a>
            </div>
        </div>
    </main>

    <!-- Add this script at the bottom of auth.html -->
    <script>
        function switchRole(role) {
            const studentBtn = document.querySelector('.toggle-btn:first-child');
            const tutorBtn = document.querySelector('.toggle-btn:last-child');
            const formTitle = document.getElementById('formTitle');
            const tutorFields = document.querySelector('.tutor-only');
            const submitBtn = document.querySelector('button[type="submit"]');

            if (role === 'student') {
                studentBtn.classList.add('active');
                tutorBtn.classList.remove('active');
                formTitle.innerText = "Student Registration";
                submitBtn.innerText = "Create Student Account";
                if(tutorFields) tutorFields.style.display = 'none';
            } else {
                tutorBtn.classList.add('active');
                studentBtn.classList.remove('active');
                formTitle.innerText = "Tutor Registration";
                submitBtn.innerText = "Create Tutor Account";
                if(tutorFields) tutorFields.style.display = 'block';
            }
        }
    </script>
</body>
</html>
