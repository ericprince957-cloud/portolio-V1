<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">ABSU Tutors</div>
            <nav>
                <a href="#" class="active"><i class="fas fa-store"></i> Marketplace</a>
                <a href="#"><i class="fas fa-book"></i> My Books</a>
                <a href="#"><i class="fas fa-comment-dots"></i> Messages <span class="badge-count">2</span></a>
                <a href="#"><i class="fas fa-user"></i> Profile</a>
                <a href="index.html" class="logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="dash-main">
            <!-- Top Bar with Search -->
            <header class="dash-header">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search for tutors, books, or subjects...">
                </div>
                <div class="user-profile">
                    <div class="avatar">JD</div>
                    <span>John Doe</span>
                </div>
            </header>

            <!-- Shop Grid -->
            <section class="shop-section">
                <h2>Featured Services & Books</h2>
                <div class="shop-grid">
                    <!-- Card 1 -->
                    <div class="shop-card">
                        <div class="card-image" style="background: linear-gradient(45deg, #1e40af, #00c896);">
                            <i class="fas fa-calculator"></i>
                        </div>
                        <div class="card-content">
                            <span class="tag">Service</span>
                            <h3>Advanced Calculus</h3>
                            <p>Dr. Eric Prince</p>
                            <div class="price-row">
                                <span class="price">₦10,000</span>
                                <button class="btn-sm">Book</button>
                            </div>
                        </div>
                    </div>

                    <!-- Card 2 -->
                    <div class="shop-card">
                        <div class="card-image" style="background: linear-gradient(45deg, #00c896, #0a2540);">
                            <i class="fas fa-book-open"></i>
                        </div>
                        <div class="card-content">
                            <span class="tag">E-Book</span>
                            <h3>Physics 101 Guide</h3>
                            <p>Jane Smith</p>
                            <div class="price-row">
                                <span class="price">5,000</span>
                                <button class="btn-sm">Buy</button>
                            </div>
                        </div>
                    </div>

                    <!-- Card 3 -->
                    <div class="shop-card">
                        <div class="card-image" style="background: linear-gradient(45deg, #ff4d4d, #0a2540);">
                            <i class="fas fa-flask"></i>
                        </div>
                        <div class="card-content">
                            <span class="tag">Service</span>
                            <h3>Chemistry Lab Prep</h3>
                            <p>Michael Brown</p>
                            <div class="price-row">
                                <span class="price">₦12,000</span>
                                <button class="btn-sm">Book</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
